<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>चाहाडे ट्रान्सपोर्ट आणि लॉजिस्टिक सर्व्हिस महाराष्ट्र</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top, #7c2d12 0%, #431407 50%, #270a03 100%);
            color: #fffaf0; 
        }
    </style>
</head>
<body class="p-2.5 md:p-6 min-h-screen flex items-center justify-center">

    <div class="max-w-lg w-full bg-gradient-to-b from-[#3a1005] via-[#2a0b03] to-[#1c0601] rounded-3xl shadow-2xl overflow-hidden border-2 border-amber-500/70">
        
        <!-- Top Strip -->
        <div class="bg-gradient-to-r from-orange-700 via-amber-500 to-red-700 py-2.5 px-4 text-center shadow-md flex items-center justify-center gap-2 border-b border-amber-300/40">
            <span class="text-white text-lg">🚩</span>
            <span class="text-white font-black text-sm md:text-base tracking-wider drop-shadow">
                ॥ जय भवानी ॥ जय शिवाजी ॥ जय महाराष्ट्र ॥
            </span>
            <span class="text-white text-lg">🚩</span>
        </div>

        <!-- Header -->
        <div class="relative bg-gradient-to-b from-[#521707] via-[#3a1005] to-[#250a03] p-6 text-center border-b-2 border-amber-500/40 overflow-hidden">
            <div class="relative z-10 flex flex-col items-center">
                <h1 class="text-3xl font-black tracking-tight text-amber-200 drop-shadow mt-2">चाहाडे ट्रान्सपोर्ट</h1>
                <p class="text-xs font-bold text-amber-400 tracking-widest uppercase mt-0.5">लॉजिस्टिक आणि मालवाहतूक सेवा</p>
                <span class="inline-flex items-center gap-1.5 bg-[#6c200a]/70 text-amber-200 text-[11px] font-bold px-3.5 py-1 rounded-full uppercase tracking-wider border border-amber-400/50 mt-2.5">
                    📍 पालघर जिल्हा अधिकृत कमर्शियल लोडिंग हब
                </span>
            </div>
        </div>

        <div class="p-4 md:p-6 space-y-4">
            
            <!-- 🔍 SECTION: CHECK & REMOVE BOOKING/INQUIRY HISTORY -->
            <div class="bg-[#2a0b03] border-2 border-amber-500/40 rounded-2xl overflow-hidden shadow-lg">
                <button type="button" onclick="toggleTrackOrderFolder()" 
                    class="w-full p-3.5 flex justify-between items-center bg-gradient-to-r from-[#381005] to-[#200701] text-left">
                    <div class="flex items-center gap-2">
                        <span class="text-lg">📦</span>
                        <div>
                            <p class="text-xs font-black text-amber-200 uppercase tracking-wide">माझी जुनी बुकिंग व चौकशी तपासा</p>
                            <p class="text-[10px] text-amber-300/70">टॅप करा = उघडा / पुन्हा टॅप करा = बंद</p>
                        </div>
                    </div>
                    <span id="trackOrderToggleIcon" class="text-amber-300 text-xs font-bold px-2.5 py-1 rounded bg-black/40 border border-amber-500/30">
                        उघडा ⬇️
                    </span>
                </button>

                <div id="trackOrderContent" class="hidden p-3.5 space-y-3 bg-[#170501] border-t border-amber-600/30">
                    <div class="flex gap-2">
                        <input type="tel" id="trackMobileInput" maxlength="10" placeholder="आपला १० अंकी मोबाईल नंबर टाका" 
                            class="w-full px-3 py-2 bg-[#2d0b03] border border-amber-500/50 rounded-xl text-xs font-bold text-amber-200 placeholder-amber-200/40 focus:outline-none">
                        <button type="button" onclick="searchCustomerHistory()" 
                            class="px-4 py-2 bg-gradient-to-r from-amber-600 to-orange-600 text-white font-black text-xs rounded-xl shadow whitespace-nowrap">
                            शोध घ्या
                        </button>
                    </div>
                    <div id="trackedHistoryList" class="space-y-2.5"></div>
                </div>
            </div>

            <!-- SUCCESS CONFIRMATION MODAL -->
            <div id="bookingSuccessBox" class="hidden bg-gradient-to-b from-[#1b4317] to-[#0d230b] border-2 border-emerald-400 p-5 rounded-2xl text-center space-y-3 shadow-2xl">
                <div class="w-14 h-14 mx-auto rounded-full bg-emerald-500 text-stone-950 flex items-center justify-center text-2xl font-black shadow-lg">✓</div>
                <div>
                    <h3 id="successTitle" class="text-lg font-black text-emerald-200">यशस्वीरीत्या नोंदवले गेले!</h3>
                    <p id="successDesc" class="text-xs text-stone-200 mt-1">आपली माहिती सिस्टीममध्ये पोहोचली आहे.</p>
                </div>
                <div id="successDetailsBox" class="bg-black/40 p-3 rounded-xl border border-emerald-500/40 text-left text-xs space-y-1.5 text-emerald-100"></div>
                <button type="button" onclick="resetFormForNextBooking()" 
                    class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-stone-950 font-black rounded-xl text-xs uppercase tracking-wider transition">
                    नवीन अर्ज करा (New Form)
                </button>
            </div>

            <!-- Booking & Inquiry Form -->
            <form id="transportForm" class="space-y-4" onsubmit="event.preventDefault();">
                
                <!-- 1. Loading Hub -->
                <div>
                    <label class="block text-xs font-bold text-amber-300 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-location-dot text-amber-400"></i> १. माल भरण्याचा जिल्हा
                    </label>
                    <input type="text" id="pickup" value="पालघर जिल्हा मुख्य हब (Palghar District Hub)" readonly
                        class="w-full px-4 py-3 bg-[#4a1507]/80 border-2 border-amber-500/60 rounded-xl font-bold text-amber-200 text-sm focus:outline-none cursor-default shadow-inner">
                </div>

                <!-- 1.1 Palghar Loading Area -->
                <div>
                    <label class="block text-xs font-bold text-amber-300 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-city text-amber-400"></i> पालघरमध्ये माल कुठून भरायचा आहे? (गाव/MIDC/पत्ता)
                    </label>
                    <input type="text" id="palgharLoadingPoint" placeholder="उदा. चाहाडे गाव, बोईसर, मनोर, तारापूर MIDC..." required
                        class="w-full px-4 py-3 bg-[#421306]/90 border-2 border-amber-500/50 rounded-xl font-medium text-white placeholder-amber-200/40 text-sm focus:outline-none focus:border-amber-400 transition">
                </div>

                <!-- 2. Maharashtra Districts -->
                <div>
                    <label class="block text-xs font-bold text-amber-300 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-map-location-dot text-amber-400"></i> २. माल कुठे खाली करायचा? (महाराष्ट्र जिल्हा)
                    </label>
                    <select id="drop" required class="w-full px-4 py-3 bg-[#421306]/90 border-2 border-amber-500/50 rounded-xl font-bold text-white text-sm focus:outline-none focus:border-amber-400 transition">
                        <option value="" disabled selected>जिल्हा निवडा</option>
                        <option value="मुंबई शहर" data-km="100">मुंबई शहर (Mumbai City) ~100 KM</option>
                        <option value="मुंबई उपनगर" data-km="95">मुंबई उपनगर (Bandra/Andheri) ~95 KM</option>
                        <option value="ठाणे" data-km="85">ठाणे (Thane / Bhiwandi) ~85 KM</option>
                        <option value="नवी मुंबई" data-km="115">नवी मुंबई (Navi Mumbai / Panvel) ~115 KM</option>
                        <option value="पालघर" data-km="40">पालघर स्थानिक (Palghar Local) ~40 KM</option>
                        <option value="नाशिक" data-km="170">नाशिक (Nashik) ~170 KM</option>
                        <option value="पुणे" data-km="220">पुणे (Pune / Pimpri Chinchwad) ~220 KM</option>
                        <option value="धुळे" data-km="290">धुळे (Dhule) ~290 KM</option>
                        <option value="जळगाव" data-km="380">जळगाव (Jalgaon) ~380 KM</option>
                        <option value="छत्रपती संभाजीनगर" data-km="350">छत्रपती संभाजीनगर (औरंगाबाद) ~350 KM</option>
                    </select>
                </div>

                <!-- 3. Unloading Address -->
                <div>
                    <label class="block text-xs font-bold text-amber-300 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-house-chimney text-amber-400"></i> ३. माल खाली करण्याचा सविस्तर पत्ता (पिनकोडसह)
                    </label>
                    <textarea id="fullAddress" rows="2" placeholder="दुकान/कंपनी नाव, गल्ली, लँडमार्क, एरिया पिनकोड..." required
                        class="w-full px-4 py-2.5 bg-[#421306]/90 border-2 border-amber-500/50 rounded-xl font-medium text-white placeholder-amber-200/40 text-sm focus:outline-none focus:border-amber-400 transition"></textarea>
                </div>

                <!-- 4. Material -->
                <div>
                    <label class="block text-xs font-bold text-amber-300 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-boxes-stacked text-amber-400"></i> ४. मालाचा प्रकार
                    </label>
                    <input type="text" id="material" placeholder="उदा. पॅकेजिंग सामान, भाजीपाला, लोखंड..." required
                        class="w-full px-4 py-3 bg-[#421306]/90 border-2 border-amber-500/50 rounded-xl font-medium text-white placeholder-amber-200/40 text-sm focus:outline-none focus:border-amber-400 transition">
                </div>

                <!-- 5. Weight & Vehicle Sync -->
                <div>
                    <label class="block text-xs font-bold text-amber-300 uppercase tracking-wider mb-1.5 flex items-center justify-between">
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-weight-scale text-amber-400"></i> ५. मालाचे अंदाजे वजन</span>
                        <span class="text-[10px] text-emerald-400 font-bold">● गाडी आपोआप निवडली जाईल</span>
                    </label>
                    <select id="cargoWeight" onchange="syncWeightToVehicle()" required class="w-full px-3 py-3 bg-[#421306]/90 border-2 border-amber-500/50 rounded-xl font-bold text-amber-200 text-xs focus:outline-none focus:border-amber-400 transition">
                        <option value="५०० किलो पर्यंत" data-vindex="1">५०० किलो पर्यंत (टाटा एस)</option>
                        <option value="१ टन ते १.७ टन" data-vindex="0" selected>१ टन ते १.७ टन (बोलेरो पिकअप)</option>
                        <option value="२ टन ते ४.५ टन" data-vindex="2">२ टन ते ४.५ टन (आयशर १४ फूट)</option>
                    </select>
                </div>

                <!-- 6. Date & Time -->
                <div class="bg-[#4d1607]/80 p-3.5 rounded-2xl border-2 border-amber-500/50 space-y-2.5">
                    <div>
                        <label class="block text-xs font-bold text-amber-300 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                            <i class="fa-solid fa-calendar-days text-amber-400"></i> ६. गाडी भरण्याची तारीख व वेळ
                        </label>
                        <input type="date" id="loadingDate" required
                            class="w-full px-3 py-2.5 bg-[#330e04] border border-amber-500/40 rounded-xl font-bold text-amber-200 text-xs focus:outline-none mb-2">
                        <div class="grid grid-cols-2 gap-2">
                            <select id="timeHour" class="px-3 py-2 bg-[#330e04] border border-amber-500/40 rounded-xl font-bold text-white text-xs">
                                <option value="08:00">०८:०० वा.</option>
                                <option value="10:00" selected>१०:०० वा.</option>
                                <option value="12:00">१२:०० वा.</option>
                                <option value="03:00">०३:०० वा.</option>
                            </select>
                            <select id="timeAmPm" class="px-3 py-2 bg-[#330e04] border border-amber-500/40 rounded-xl font-black text-amber-300 text-xs">
                                <option value="AM (सकाळ)">🌅 AM (सकाळ)</option>
                                <option value="PM (दुपार/संध्याकाळ)">☀️ PM (दुपार/संध्याकाळ)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 7. Mobile Number -->
                <div>
                    <label class="block text-xs font-bold text-amber-300 uppercase tracking-wider mb-1.5 flex items-center justify-between">
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-phone text-emerald-400"></i> ७. ग्राहकाचा संपर्क नंबर</span>
                        <span id="mobileCountBadge" class="text-[10px] text-amber-400 font-black">0/10 अंक</span>
                    </label>
                    <input type="tel" id="mobile" maxlength="10" placeholder="१० अंकी मोबाईल नंबर टाका" required
                        oninput="validateMobileInput(this)"
                        class="w-full px-4 py-3 bg-[#421306]/90 border-2 border-amber-500/50 rounded-xl font-black tracking-widest text-amber-200 text-sm focus:outline-none">
                    <p id="mobileErrorMsg" class="hidden text-[10px] text-red-400 font-bold mt-1">⚠️ फक्त ० ते ९ अंक टाका!</p>
                </div>

                <!-- 8. Commercial Vehicles -->
                <div>
                    <label class="block text-xs font-bold text-amber-300 uppercase tracking-wider mb-1.5 flex items-center justify-between">
                        <span><i class="fa-solid fa-truck-moving text-amber-400"></i> ८. लागणारी मालवाहतूक गाडी</span>
                        <span class="text-[10px] text-emerald-400 font-bold">● Live Status</span>
                    </label>
                    <select id="vehicle" onchange="syncVehicleToWeight()" class="w-full px-4 py-3 bg-[#421306]/90 border-2 border-amber-500/50 rounded-xl font-bold text-white text-sm">
                    </select>
                </div>

                <!-- 🎯 SELECTION: BOOKING OR INQUIRY (NEW FEATURE) -->
                <div class="bg-[#4d1607]/90 p-4 rounded-2xl border-2 border-amber-500/60 space-y-3">
                    <label class="block text-xs font-black text-amber-300 uppercase tracking-wider">
                        ९. तुम्हाला काय करायचे आहे? (Select Action)
                    </label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" onclick="selectActionType('booking')" id="btnBooking"
                            class="py-3 px-2 bg-emerald-600 text-white font-black rounded-xl text-xs uppercase border-2 border-emerald-400 shadow">
                            📦 थेट बुकिंग (Booking)
                        </button>
                        <button type="button" onclick="selectActionType('inquiry')" id="btnInquiry"
                            class="py-3 px-2 bg-[#330e04] text-amber-300 font-black rounded-xl text-xs uppercase border-2 border-amber-500/40 shadow">
                            ❓ चौकशी (Inquiry)
                        </button>
                    </div>

                    <!-- Inquiry Sub-options -->
                    <div id="inquiryOptionsBox" class="hidden pt-3 border-t border-amber-500/30 space-y-2">
                        <label class="block text-xs font-bold text-amber-200">चौकशीचा विषय निवडा:</label>
                        <select id="inquirySubtype" class="w-full px-3 py-2 bg-[#200701] border border-amber-500/50 rounded-xl text-xs text-white">
                            <option value="भाडे विषयक चौकशी (Price Inquiry)">भाडे विषयक चौकशी (Price Inquiry)</option>
                            <option value="अंतर/रूट विषयक चौकशी (Distance Inquiry)">अंतर/रूट विषयक चौकशी (Distance Inquiry)</option>
                            <option value="ॲडव्हान्स बुकिंग चौकशी (Advance Booking Inquiry)">ॲडव्हान्स बुकिंग चौकशी (Advance Booking Inquiry)</option>
                            <option value="इतर व्यावसायिक चौकशी (General Inquiry)">इतर व्यावसायिक चौकशी (General Inquiry)</option>
                        </select>
                    </div>
                </div>

                <!-- Calculate Fare Button (For Booking) -->
                <button type="button" id="calcBtn" onclick="toggleCalculateFare()" 
                    class="w-full py-4 px-4 bg-gradient-to-r from-orange-600 via-amber-500 to-red-600 hover:brightness-110 text-white font-black rounded-2xl shadow-xl text-sm uppercase tracking-wider flex items-center justify-center gap-2">
                    <i class="fa-solid fa-calculator"></i> <span id="calcBtnText">अंदाजे भाडे तपासा (Show Fare)</span>
                </button>

                <!-- 📊 FARE RESULT CARD -->
                <div id="fareResultCard" class="hidden space-y-4 pt-3 border-t-2 border-amber-500/40">
                    <div class="bg-[#4a1507]/90 border-2 border-amber-400/70 p-4 rounded-2xl space-y-3">
                        <div class="flex justify-between items-center bg-[#300c03] px-3 py-2 rounded-xl border text-xs">
                            <span class="text-amber-200 font-bold">🛣️ अंतर:</span>
                            <span id="distanceDisplay" class="font-black text-amber-300">0 KM</span>
                        </div>
                        <div class="flex justify-between items-center text-xs font-black text-amber-200 uppercase">
                            <span>अंदाजे एकूण भाडे:</span>
                            <span id="fareDisplay" class="text-2xl font-black text-amber-300">₹ 0</span>
                        </div>
                    </div>
                    <button type="button" onclick="submitUserRequest()" 
                        class="w-full py-4 bg-gradient-to-r from-emerald-600 to-green-600 text-white font-black rounded-2xl shadow-xl text-sm uppercase tracking-wider">
                        <span id="submitBtnText">बुकिंग ऑर्डर कन्फर्म करा (CONFIRM BOOKING)</span>
                    </button>
                </div>

                <!-- Direct Submit Button (For Inquiry Mode) -->
                <button type="button" id="inquirySubmitBtn" onclick="submitUserRequest()" 
                    class="hidden w-full py-4 bg-gradient-to-r from-orange-600 to-amber-600 text-white font-black rounded-2xl shadow-xl text-sm uppercase tracking-wider">
                    📩 चौकशी थेट पाठवा (Send Inquiry)
                </button>

            </form>
        </div>
    </div>

    <script>
        const dbUrl = "https://manorbiryani-default-rtdb.firebaseio.com/chahade_transport/";
        let calculatedPrice = 0;
        let routeKm = 0;
        let isFareCardOpen = false;
        let currentMode = 'booking'; // 'booking' or 'inquiry'

        let availableVehicleCategories = [
            { id: "v_pickup", name: "महिंद्रा बोलेरो / पिकअप (कमाल १.५ टन)", rate: 22, available: true },
            { id: "v_ace", name: "टाटा एस - छोटा हत्ती (कमाल १ टन)", rate: 16, available: true },
            { id: "v_eicher14", name: "आयशर १४ फूट ट्रक (कमाल ४-५ टन)", rate: 36, available: true }
        ];
        let baseFixedCharge = 800;

        async function loadData() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('loadingDate').value = today;
            document.getElementById('loadingDate').min = today;

            try {
                const res = await fetch(dbUrl + "vehicles.json");
                const cloudVehicles = await res.json();
                if (cloudVehicles && Array.isArray(cloudVehicles)) {
                    availableVehicleCategories = cloudVehicles;
                }
            } catch(e) {}

            const vehicleSelect = document.getElementById('vehicle');
            vehicleSelect.innerHTML = '';
            availableVehicleCategories.forEach((v, index) => {
                const opt = document.createElement('option');
                opt.value = v.name;
                opt.setAttribute('data-rate', v.rate);
                opt.setAttribute('data-index', index);
                
                if (v.available === false) {
                    opt.disabled = true;
                    opt.innerText = `🚫 ${v.name} (तात्पुरती उपलब्ध नाही)`;
                } else {
                    opt.innerText = `${v.name} (₹${v.rate}/KM)`;
                }
                vehicleSelect.appendChild(opt);
            });
            syncWeightToVehicle();
        }

        function selectActionType(mode) {
            currentMode = mode;
            const btnB = document.getElementById('btnBooking');
            const btnI = document.getElementById('btnInquiry');
            const boxI = document.getElementById('inquiryOptionsBox');
            const calcBtn = document.getElementById('calcBtn');
            const inqSubBtn = document.getElementById('inquirySubmitBtn');
            const fareCard = document.getElementById('fareResultCard');

            if(mode === 'booking') {
                btnB.className = "py-3 px-2 bg-emerald-600 text-white font-black rounded-xl text-xs uppercase border-2 border-emerald-400 shadow";
                btnI.className = "py-3 px-2 bg-[#330e04] text-amber-300 font-black rounded-xl text-xs uppercase border-2 border-amber-500/40 shadow";
                boxI.classList.add('hidden');
                calcBtn.classList.remove('hidden');
                inqSubBtn.classList.add('hidden');
            } else {
                btnI.className = "py-3 px-2 bg-orange-600 text-white font-black rounded-xl text-xs uppercase border-2 border-orange-400 shadow";
                btnB.className = "py-3 px-2 bg-[#330e04] text-amber-300 font-black rounded-xl text-xs uppercase border-2 border-amber-500/40 shadow";
                boxI.classList.remove('hidden');
                calcBtn.classList.add('hidden');
                fareCard.classList.add('hidden');
                inqSubBtn.classList.remove('hidden');
            }
        }

        function toggleCalculateFare() {
            const resultCard = document.getElementById('fareResultCard');
            const btnText = document.getElementById('calcBtnText');

            if (isFareCardOpen) {
                resultCard.classList.add('hidden');
                btnText.innerText = "अंदाजे भाडे तपासा (Show Fare)";
                isFareCardOpen = false;
                return;
            }

            const palgharPoint = document.getElementById('palgharLoadingPoint').value.trim();
            const dropSelect = document.getElementById('drop');
            const fullAddress = document.getElementById('fullAddress').value.trim();
            const mobile = document.getElementById('mobile').value;

            if(!palgharPoint || !dropSelect.value || !fullAddress || mobile.length !== 10) {
                alert("कृपया सर्व माहिती व १० अंकी मोबाईल नंबर अचूक भरा!");
                return;
            }

            const selectedDrop = dropSelect.options[dropSelect.selectedIndex];
            routeKm = Number(selectedDrop.getAttribute('data-km')) || 100;

            const vehicleSelect = document.getElementById('vehicle');
            const selectedVehOpt = vehicleSelect.options[vehicleSelect.selectedIndex];
            const ratePerKm = Number(selectedVehOpt.getAttribute('data-rate')) || 22;

            calculatedPrice = Math.round((routeKm * ratePerKm) + baseFixedCharge);

            document.getElementById('distanceDisplay').innerText = `~${routeKm} KM`;
            document.getElementById('fareDisplay').innerText = "₹ " + calculatedPrice.toLocaleString('en-IN');

            resultCard.classList.remove('hidden');
            btnText.innerText = "भाडे तपशील लपवा (Hide Fare)";
            isFareCardOpen = true;
        }

        async function submitUserRequest() {
            const palgharPoint = document.getElementById('palgharLoadingPoint').value.trim();
            const dropSelect = document.getElementById('drop');
            const fullAddress = document.getElementById('fullAddress').value.trim();
            const material = document.getElementById('material').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const vehicle = document.getElementById('vehicle').value;

            if(!palgharPoint || !dropSelect.value || !fullAddress || !material || mobile.length !== 10) {
                alert("कृपया सर्व माहिती अचूक भरा!");
                return;
            }

            const dropText = dropSelect.options[dropSelect.selectedIndex].text;
            const km = Number(dropSelect.options[dropSelect.selectedIndex].getAttribute('data-km')) || 100;
            const vehicleObj = availableVehicleCategories.find(v => v.name === vehicle) || availableVehicleCategories[0];
            const fare = calculatedPrice > 0 ? calculatedPrice : Math.round((km * vehicleObj.rate) + baseFixedCharge);

            const recordId = (currentMode === 'booking' ? "ORD-" : "INQ-") + Math.floor(1000 + Math.random() * 9000);

            const recordData = {
                id: recordId,
                type: currentMode,
                subType: currentMode === 'inquiry' ? document.getElementById('inquirySubtype').value : 'Direct Booking',
                bookedOn: new Date().toLocaleDateString('en-IN'),
                loadingDate: document.getElementById('loadingDate').value,
                loadingTime: document.getElementById('timeHour').value + ' ' + document.getElementById('timeAmPm').value,
                from: palgharPoint,
                to: dropText,
                fullAddress: fullAddress,
                material: material,
                customer: mobile,
                vehicle: vehicle,
                fare: fare,
                status: currentMode === 'booking' ? "Confirmed" : "Pending Inquiry",
                assignedDriverName: null,
                assignedDriverPhone: null,
                assignedVehicleNo: null,
                timestamp: Date.now()
            };

            const endpoint = currentMode === 'booking' ? `orders/${recordId}.json` : `inquiries/${recordId}.json`;
            await fetch(dbUrl + endpoint, {
                method: "PUT",
                body: JSON.stringify(recordData)
            });

            document.getElementById('transportForm').classList.add('hidden');
            const successBox = document.getElementById('bookingSuccessBox');
            
            if(currentMode === 'inquiry') {
                document.getElementById('successTitle').innerText = "चौकशी यशस्वीरीत्या नोंदवली गेली!";
                document.getElementById('successDesc').innerText = "आपली चौकशी ॲडमिनकडे पोचली आहे. लवकरच मराठीमध्ये उत्तर मिळेल.";
                document.getElementById('successDetailsBox').innerHTML = `<p>🆔 चौकशी ID: <span class="text-amber-300">${recordId}</span></p>`;
            } else {
                document.getElementById('successTitle').innerText = "बुकिंग यशस्वीरीत्या नोंदवली गेली!";
                document.getElementById('successDesc').innerText = "आपली ऑर्डर सिस्टीममध्ये कन्फर्म झाली आहे.";
                document.getElementById('successDetailsBox').innerHTML = `
                    <p>🆔 बुकिंग ID: <span class="text-amber-300 font-black">${recordId}</span></p>
                    <p>💰 अंदाजे भाडे: <span class="text-amber-300 font-bold">₹${fare}</span></p>
                `;
            }
            successBox.classList.remove('hidden');
            window.scrollTo({ top: 100, behavior: 'smooth' });
        }

        function toggleTrackOrderFolder() {
            const content = document.getElementById('trackOrderContent');
            const icon = document.getElementById('trackOrderToggleIcon');
            content.classList.toggle('hidden');
            icon.innerText = content.classList.contains('hidden') ? "उघडा ⬇️" : "बंद करा ⬆️";
        }

        async function searchCustomerHistory() {
            const phone = document.getElementById('trackMobileInput').value.trim();
            const list = document.getElementById('trackedHistoryList');
            list.innerHTML = "<p class='text-xs text-amber-300'>शोधत आहे...</p>";
            if(phone.length !== 10) { alert("१० अंकी नंबर टाका"); list.innerHTML = ""; return; }

            try {
                const resOrders = await fetch(dbUrl + "orders.json");
                const resInq = await fetch(dbUrl + "inquiries.json");
                const ordersObj = await resOrders.json() || {};
                const inqObj = await resInq.json() || {};

                list.innerHTML = "";
                const allItems = [...Object.values(ordersObj), ...Object.values(inqObj)].filter(x => x.customer === phone);

                allItems.forEach(item => {
                    const isAssigned = item.assignedDriverPhone;
                    list.innerHTML += `
                        <div class="bg-[#280902] border border-amber-500/30 p-3 rounded-xl space-y-1.5 text-xs text-stone-200">
                            <div class="flex justify-between font-black text-amber-300">
                                <span>#${item.id} (${item.type === 'booking' ? '📦 बुकिंग' : '❓ चौकशी'})</span>
                                <span class="text-emerald-400">₹${item.fare || 0}</span>
                            </div>
                            <p>📍 ${item.from} ➔ ${item.to}</p>
                            <p>🚛 गाडी: ${item.vehicle}</p>
                            ${isAssigned ? `
                                <div class="bg-emerald-950 p-2 rounded border border-emerald-500/40 mt-2 space-y-1">
                                    <p class="text-emerald-300 font-bold">✓ नियुक्त चालक / मालक:</p>
                                    <p class="text-white font-bold">👤 ${item.assignedDriverName} (${item.assignedVehicleNo || 'गाडी नंबर'})</p>
                                    <p class="text-amber-200 font-black">📞 ${item.assignedDriverPhone}</p>
                                    <a href="tel:${item.assignedDriverPhone}" class="block text-center w-full py-1.5 bg-emerald-600 text-white font-bold rounded mt-1">थेट कॉल करा</a>
                                </div>
                            ` : `<p class="text-[10px] text-amber-300/60 italic">कार्यालयातून प्रक्रिया सुरू आहे...</p>`}
                        </div>
                    `;
                });

                if(allItems.length === 0) {
                    list.innerHTML = "<p class='text-xs text-amber-300/60 italic'>या नंबरवर कोणतीही माहिती सापडली नाही.</p>";
                }
            } catch(e) {
                list.innerHTML = "<p class='text-xs text-red-400'>एरर आली.</p>";
            }
        }

        function syncWeightToVehicle() {
            const weightSelect = document.getElementById('cargoWeight');
            const vehicleSelect = document.getElementById('vehicle');
            const targetIndex = Number(weightSelect.options[weightSelect.selectedIndex].getAttribute('data-vindex')) || 0;
            if (vehicleSelect.options.length > targetIndex && !vehicleSelect.options[targetIndex].disabled) {
                vehicleSelect.selectedIndex = targetIndex;
            }
        }

        function syncVehicleToWeight() {
            const vehicleSelect = document.getElementById('vehicle');
            const weightSelect = document.getElementById('cargoWeight');
            const currentIndex = vehicleSelect.selectedIndex;
            for (let i = 0; i < weightSelect.options.length; i++) {
                if (Number(weightSelect.options[i].getAttribute('data-vindex')) === currentIndex) {
                    weightSelect.selectedIndex = i;
                    break;
                }
            }
        }

        function validateMobileInput(input) {
            const errorMsg = document.getElementById('mobileErrorMsg');
            const badge = document.getElementById('mobileCountBadge');
            const cleanDigits = input.value.replace(/[^0-9]/g, '');
            if (input.value !== cleanDigits) { errorMsg.classList.remove('hidden'); } else { errorMsg.classList.add('hidden'); }
            input.value = cleanDigits.slice(0, 10);
            badge.innerText = `${input.value.length}/10 अंक`;
        }

        function resetFormForNextBooking() {
            document.getElementById('bookingSuccessBox').classList.add('hidden');
            document.getElementById('transportForm').classList.remove('hidden');
            document.getElementById('transportForm').reset();
            document.getElementById('fareResultCard').classList.add('hidden');
            isFareCardOpen = false;
            loadData();
        }

        window.onload = loadData;
    </script>
</body>
</html>
